<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever Flags Style Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    header {
      background: #002868;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      background: url('https://images.unsplash.com/photo-flag') center/cover no-repeat;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .hero h2 {
      font-size: 40px;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 8px;
    }

    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin: 0 0 10px;
    }

    .price {
      color: #b22234;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #002868;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <h1>Forever Flag</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Premium Flags That Last Forever</h2>
</section>

<div class="container">
  <h2>Featured Products</h2>
  <div class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-usa-flag" alt="Flag">
      <div class="card-content">
        <h3>American Flag</h3>
        <p class="price">$79.99</p>
        <a href="#" class="btn">View Product</a>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-flag2" alt="Flag">
      <div class="card-content">
        <h3>State Flag</h3>
        <p class="price">$59.99</p>
        <a href="#" class="btn">View Product</a>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-flag3" alt="Flag">
      <div class="card-content">
        <h3>Custom Flag</h3>
        <p class="price">$99.99</p>
        <a href="#" class="btn">View Product</a>
      </div>
    </div>

  </div>
</div>

<footer>
  <p>&copy; 2026 Forever Flags Style Site</p>
</footer>

</body>
</html>
